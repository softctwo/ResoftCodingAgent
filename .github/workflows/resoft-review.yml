name: Resoft Code Review

on:
  pull_request:
    paths:
      - '**.sql'
      - '**.py'
      - '**.java'
      - '**.scala'
      - '**.yml'
      - '**.yaml'
  push:
    branches: [main]
    paths:
      - '**.sql'
      - '**.py'
      - '**.java'
      - '**.scala'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd pi-agent && npm install

      - name: Build
        run: |
          cd pi-agent && npm run build

      - name: Get changed ETL files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(sql|py|java|scala)$' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run Resoft Review
        if: steps.changed.outputs.files != ''
        run: |
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }} \
          npx resoft ci --files "${{ steps.changed.outputs.files }}" --format json --min-severity warning
