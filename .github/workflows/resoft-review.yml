name: Resoft Code Review

on:
  pull_request:
    paths:
      - '**.sql'
      - '**.py'
      - '**.java'
      - '**.scala'
      - '**.yml'
      - '**.yaml'
  push:
    branches: [main]
    paths:
      - '**.sql'
      - '**.py'
      - '**.java'
      - '**.scala'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Get changed ETL files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(sql|py|java|scala)$' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.(sql|py|java|scala)$' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run Resoft Review
        if: steps.changed.outputs.files != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node pi-agent/packages/resoft-coding-agent/dist/cli.js ci \
            --files "${{ steps.changed.outputs.files }}" \
            --format json \
            --min-severity warning \
            --fail-on-error
